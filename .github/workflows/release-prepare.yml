name: Release preparation

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]

concurrency:
  group: release-preparation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    # Only trusted current main is read; never consume a run's checkout/artifacts.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - id: candidate
        run: python3 .github/scripts/release.py can-prepare
      - name: Require release bot credentials
        if: steps.candidate.outputs.ready == 'true'
        env:
          APP_ID: ${{ vars.RELEASE_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo 'Configure RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY for release PRs and automatic PR CI. See docs/releases.md.' >&2
            exit 1
          fi
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app
        if: steps.candidate.outputs.ready == 'true'
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        if: steps.candidate.outputs.ready == 'true'
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        if: steps.candidate.outputs.ready == 'true'
        with:
          tool: release-plz@0.3.162
      - name: Maintain product release PR
        if: steps.candidate.outputs.ready == 'true'
        env:
          GIT_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 scripts/prepare-release.py release-pr
