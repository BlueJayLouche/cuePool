name: Release

# Builds + packages CuePool and attaches it to a GitHub release.
#   macOS   -> .app bundle in a .dmg (ad-hoc signed)
#   Windows -> portable .zip + .msi installer (WiX, Start-menu shortcut)
#
# Product version changes on main create a candidate. Manual runs without a
# release_tag are artifacts-only dry runs. Tags and retries use the same gate.
# This workflow alone owns publication and published/v* receipts.
#
# Icon slots, picked up automatically if present:
#   packaging/AppIcon.icns -> macOS bundle icon
#   packaging/icon.ico     -> Windows Start-menu shortcut icon
#
# Linux is not built here: CuePool's FFmpeg closure is untested on Linux.
# CI still builds and tests the workspace on Linux every PR.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing vX.Y.Z tag to release or retry (empty = artifacts-only dry run)"
        default: ""

concurrency:
  group: cuepool-release
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DISPLAY_NAME: CuePool

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.candidate.outputs.active }}
      published: ${{ steps.candidate.outputs.published }}
      tag: ${{ steps.candidate.outputs.tag }}
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0
      - id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 .github/scripts/release.py candidate

  verify:
    needs: prepare
    if: needs.prepare.outputs.active == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.prepare.outputs.sha }}

  tag:
    needs: [prepare, verify]
    if: needs.prepare.outputs.active == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Create immutable candidate tag after verification
        if: needs.prepare.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: python3 .github/scripts/release.py tag --tag "$RELEASE_TAG" --sha "$SOURCE_SHA"
      # GITHUB_TOKEN-created tags do not trigger push workflows. The build job
      # below explicitly continues this workflow, so no token-trigger assumption.

  build:
    needs: [prepare, verify, tag]
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      # dtolnay/rust-toolchain publishes per-version refs (like `1.97.1`) only
      # as branches, which can be force-pushed and orphan their old commits.
      # Pin to the `master` branch tip (fast-forwarded, so old SHAs stay
      # reachable) and select the toolchain via `with:` instead.
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master (toolchain: 1.97.1)
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg dylibbundler

      - name: Install FFmpeg SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Pinned to the immutable 8.0 SDK: it matches the FFMPEG_DIR SDK and
          # runtime DLLs on the venue rigs, and CuePool's D3D12VA layout guard
          # rejects the 8.1.2+ ABI (struct rework) by design. BtbN's
          # "n8.1-latest" is a moving target that crossed that rework.
          curl.exe -L -o "$env:RUNNER_TEMP\ffmpeg.zip" "https://github.com/GyanD/codexffmpeg/releases/download/8.0/ffmpeg-8.0-full_build-shared.zip"
          # Digest recorded 2026-09-04 against the URL above.
          $expected = "d2bfb598ec5d8d69c86cb198decc829fefb2c0acaa7ddd27ab5348139cce3dea"
          $actual = (Get-FileHash "$env:RUNNER_TEMP\ffmpeg.zip" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "ffmpeg-8.0 SDK digest mismatch: $actual" }
          Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $dir = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1
          "FFMPEG_DIR=$($dir.FullName)" >> $env:GITHUB_ENV

      - name: Build identity from Cargo and Git
        shell: bash
        run: |
          package_id="$(cargo pkgid -p cuepool)"
          echo "VERSION=${package_id##*#}" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked -p cuepool --all-features

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="dist/$DISPLAY_NAME.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" out
          cp target/release/cuepool "$APP/Contents/MacOS/"
          [ -f packaging/AppIcon.icns ] && cp packaging/AppIcon.icns "$APP/Contents/Resources/"
          sed -e "s/__NAME__/$DISPLAY_NAME/g" \
              -e "s/__BIN__/cuepool/g" \
              -e "s/__VERSION__/$VERSION/g" \
              .github/packaging/Info.plist.tmpl > "$APP/Contents/Info.plist"
          BIN="$APP/Contents/MacOS/cuepool"
          # pull the brew FFmpeg dylib closure into the bundle and rewrite load paths
          dylibbundler -cd -od -b -x "$BIN" \
            -d "$APP/Contents/libs/" -p @executable_path/../libs/
          # Normalize rpaths: dylibbundler rewrites every existing rpath to its
          # -p value (leaving duplicates that macOS 26+ dyld refuses to load),
          # and shipped apps shouldn't carry build-machine paths anyway.
          # Strip everything, then add the one rpath the bundle needs.
          otool -l "$BIN" | awk '/LC_RPATH/{getline; getline; print $2}' | while read -r rp; do
            install_name_tool -delete_rpath "$rp" "$BIN" 2>/dev/null || true
          done
          install_name_tool -add_rpath @executable_path/../Frameworks "$BIN"
          codesign --force --deep -s - "$APP"
          hdiutil create -volname "$DISPLAY_NAME" -srcfolder "$APP" -ov -format UDZO \
            out/cuepool-macos-arm64.dmg
          hdiutil verify out/cuepool-macos-arm64.dmg
          codesign --verify --deep --strict "$APP"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = "dist\cuepool"
          New-Item -ItemType Directory -Force $dist, out | Out-Null
          Copy-Item "target\release\cuepool.exe" $dist
          Copy-Item "$env:FFMPEG_DIR\bin\*.dll" $dist
          Compress-Archive -Path "$dist\*" -DestinationPath "out\cuepool-windows-x86_64.zip"
          # Explorer file association: .qproj -> CuePool.
          .github\scripts\make-msi.ps1 -Name $env:DISPLAY_NAME -Version $env:VERSION `
            -SourceDir $dist -Exe "cuepool.exe" `
            -Icon "packaging\icon.ico" `
            -Out "out\cuepool-windows-x86_64.msi" -FileExt "qproj"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cuepool-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  validate-packages:
    name: Validate publication prerequisites
    needs: [prepare, verify, build]
    if: always() && needs.prepare.outputs.active == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.build.result == 'success' && needs.verify.result == 'success'
        with:
          path: artifacts
      # This read-only gate also runs for artifacts-only rehearsals and failed
      # builds: a missing platform cannot pass even when publication is disabled.
      - env:
          BUILD_RESULT: ${{ needs.build.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: >-
          python3 .github/scripts/release.py validate-artifacts --artifacts artifacts
          --build-result "$BUILD_RESULT" --verification-result "$VERIFY_RESULT"

  release:
    name: Publish verified release
    needs: [prepare, verify, build, validate-packages]
    if: needs.prepare.outputs.tag != '' && needs.validate-packages.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Download both platform packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Verify, upload draft, read back, publish, record receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          BUILD_RESULT: ${{ needs.build.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: >-
          python3 .github/scripts/release.py publish
          --tag "$RELEASE_TAG" --sha "$SOURCE_SHA" --artifacts artifacts
          --build-result "$BUILD_RESULT" --verification-result "$VERIFY_RESULT"

  recover-receipt:
    name: Recover already published release receipt
    needs: prepare
    if: needs.prepare.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: python3 .github/scripts/release.py repair-receipt --tag "$RELEASE_TAG" --sha "$SOURCE_SHA"
